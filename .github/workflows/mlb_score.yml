name: MLB Score Pipeline

on:
  schedule:
    # 2) 경기 결과 무인 자동 채점: 13:17 KST (1차) & 13:47 KST (2차 백업)
    - cron: '17 4 * * *'
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlb-score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Score Pipeline
        run: |
          python cron_mlb.py --mode score

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add mlb_data.db app.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-score mlb_data.db via GitHub Actions" && git push)
